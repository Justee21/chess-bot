[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chessbot"
version = "0.1.0"
description = "A chess bot that plays like Justin: personal move table plus Maia 3 fallback"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["python-chess", "numpy"]
license = { text = "AGPL-3.0-or-later" }

[project.optional-dependencies]
dev = ["pytest"]
inference = ["maia3 @ git+https://github.com/CSSLab/maia3.git@1e13597c42d4858b7cfd7cfdae01e297263364b2"]
lichess = ["PyYAML>=6,<7"]

[project.scripts]
chessbot = "chessbot.cli:main"
chessbot-uci = "chessbot.uci:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: needs Maia weights or Stockfish (run with -m slow)"]
